databaseChangeLog:
  - changeSet:
      id: create-user-table
      author: bard
      changes:
        - createTable:
            tableName: user
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: login
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: user
            columnNames: login
            constraintName: uk_user_login

        - insert:
            tableName: user
            columns:
              - column:
                  name: login
                  value: "testuser"
              - column:
                  name: password
                  value: "password123"

        - insert:
            tableName: user
            columns:
              - column:
                  name: login
                  value: "admin"
              - column:
                  name: password
                  value: "admin456"

        - insert:
            tableName: user
            columns:
              - column:
                  name: login
                  value: "weather_lover"
              - column:
                  name: password
                  value: "sunshine789"
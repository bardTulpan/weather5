databaseChangeLog:
  - changeSet:
      id: create-location-table
      author: bard
      changes:
        - createTable:
            tableName: location
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_location_user_id
                    references: user(id)
              - column:
                  name: latitude
                  type: DECIMAL(12, 8)
              - column:
                  name: longitude
                  type: DECIMAL(13, 8)

        - createIndex:
            indexName: idx_location_user_id
            tableName: location
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_location_coordinates
            tableName: location
            columns:
              - column:
                  name: latitude
              - column:
                  name: longitude

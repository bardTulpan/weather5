databaseChangeLog:
  - changeSet:
      id: create-session-table
      author: bard
      changes:
        - createTable:
            tableName: session
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_session_user_id
                    references: user(id)
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_session_user_id
            tableName: session
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_session_expires_at
            tableName: session
            columns:
              - column:
                  name: expires_at
